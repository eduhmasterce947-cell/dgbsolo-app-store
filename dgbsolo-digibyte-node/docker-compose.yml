version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dgbsolo-digibyte-node_web_1
      APP_PORT: 80

  node:
    image: ghcr.io/eduhmasterce947-cell/dgbsolo-digibyte:latest
    restart: on-failure
    stop_grace_period: 2m

    volumes:
      - ${APP_DATA_DIR}/data/digibyte:/data
      - ${APP_DATA_DIR}/data/config:/config

    ports:
      - "9001:9001"
      - "7001:7001"
      - "12024:12024"

  web:
    image: nginx:alpine
    restart: on-failure

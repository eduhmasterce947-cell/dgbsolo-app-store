version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dgbsolo-miningcore_server_1
      APP_PORT: 4000
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/eduhmasterce947-cell/dgbsolo-miningcore:latest
    restart: on-failure
    stop_grace_period: 30s

    volumes:
      - ${APP_DATA_DIR}/data/config.json:/app/config.json:ro
      - ${APP_DATA_DIR}/data/coins.json:/app/build/coins.json:ro

    ports:
      - "4000:4000"
      - "6001:6001"

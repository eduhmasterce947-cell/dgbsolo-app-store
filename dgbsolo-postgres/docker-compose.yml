version: "3.7"

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: miningcore
      POSTGRES_PASSWORD: miningcore
      POSTGRES_DB: miningcore
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - umbrel_main_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miningcore -d miningcore"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  umbrel_main_network:
    external: true

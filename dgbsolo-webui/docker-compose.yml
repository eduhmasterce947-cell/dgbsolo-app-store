version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dgbsolo-webui_web_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/eduhmasterce947-cell/dgbsolo-webui:latest@sha256:COLE_O_DIGEST_AQUI
    restart: on-failure
    stop_grace_period: 15s
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
